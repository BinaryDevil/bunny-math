# The website itself: the built files in dist/, served by Cloudflare at bunnyland.app.
# The leaderboard server is separate, in worker/.
# Deploy with: npm run deploy
name = "bunnyland"
compatibility_date = "2026-10-15"

routes = [
  { pattern = "bunnyland.app", custom_domain = true },
  { pattern = "www.bunnyland.app", custom_domain = true },
]

[assets]
directory = "./dist"

# Lets Cloudflare build a preview of every other branch and pull request.
[previews]
